spring:
  application:
    name: ticket-management-system

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: c1234567890.C

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志
  type-aliases-package: com.softwaretest.pojo

# 服务器配置
server:
  port: 8081
  servlet:
    context-path: /

# JWT配置
jwt:
  secret: mySecretKeyForJWT2024SoftwareTestProject
  expiration: 86400 # 24小时

# 日志配置
logging:
  level:
    com.softwaretest: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
